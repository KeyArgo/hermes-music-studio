<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- ArgoLabs / Inovinlabs developer stamp, drawn in the Nous visual language:
       electric blue #0000F2 + off-white #F2F2F2, circular seal + wing motif. -->
  <defs>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0000F2"/><stop offset="1" stop-color="#2233ff"/>
    </linearGradient>
  </defs>
  <!-- circular seal -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#0000F2" stroke-width="3"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="#F2F2F2" stroke-width="1" opacity="0.35"/>
  <!-- wing (Hermes motif), simplified, mirrored pair -->
  <g fill="url(#wing)">
    <path d="M64 74 C54 70 44 61 40 48 C48 52 56 56 64 57 Z"/>
    <path d="M64 74 C74 70 84 61 88 48 C80 52 72 56 64 57 Z"/>
  </g>
  <!-- ship / wheel hub = the keystone, "A" implied -->
  <path d="M64 40 L52 88 M64 40 L76 88 M56.5 72 L71.5 72" stroke="#F2F2F2" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <!-- stamp ring text cue (rendered as ticks; real text lives in the README block) -->
  <g stroke="#F2F2F2" stroke-width="1" opacity="0.5">
    <line x1="64" y1="8" x2="64" y2="14"/><line x1="64" y1="114" x2="64" y2="120"/>
    <line x1="8" y1="64" x2="14" y2="64"/><line x1="114" y1="64" x2="120" y2="64"/>
  </g>
</svg>
