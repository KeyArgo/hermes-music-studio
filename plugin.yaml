name: hermes-music-studio
label: Hermes Music Studio
kind: standalone
dashboard: dashboard
version: "1.0.0"
manifest_version: 2
api_version: 1
author: InovinLabs
license: MIT
description: >
  Describe a song and the agent drafts lyrics and style for your approval. A detached worker
  renders it on the engine you choose: ACE-Step 1.5 locally (10-180 s takes, section repaint and
  extend), or MiniMax Music 3 through a ComfyUI server (vocals; no repaint or extension). Every
  take keeps its seed, draft snapshot, engine and lineage. There is no mock engine and no cloud
  audio service. Limits are written down; voice quality is unproven.
provides_tools:
  - music_studio
provides_hooks: []
